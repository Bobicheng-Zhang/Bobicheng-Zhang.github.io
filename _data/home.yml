featured_entries:

  - title: "The pupil response to perceptual switches: What happens when you ignore them"
    url: https://jov.arvojournals.org/article.aspx?articleid=2809181
    desc: "The pupil has been found to dilate after switches in bistable perception, prompting the suggestion that
    norepinephrine-based neuromodulation plays a causal role in those switches. However, the pupil dilates in response
    to task-relevant events in general, and, in existing work, perceptual switches were typically task-relevant
    (e.g., they had to be reported). As such, observed switch-related dilations may have reflected nonspecific task
    relevance rather than switch-specific processes. Here, we measured pupil responses to perceptual switches that were
    task-irrelevant."
    highlight: Featured Research

  - title: Widespread lack of article accessibility policies among ecology and evolution journals
    url: https://www.nature.com/articles/s41559-025-02694-8
    desc: "Recent work has illuminated huge inequities in academic publishing based on author demographics such as
    assumed gender, geography, language and prestige. Yet, little attention has been paid to the inequities that
    scientists with disabilities face. We reviewed the websites of 541 ecology and evolution journals to examine the
    extent to which they prompt authors to prepare accessible manuscripts. Here we show that nearly three-quarters of
    journals do not encourage authors to consider accessibility when preparing manuscripts. Existing guidelines focus
    primarily on colour-blind-friendly figures, which were mentioned almost twice as often as any other recommendation."
    highlight: Featured Research

project_entries:

  - title: Small Business Resilience in Colorado
    url: https://github.com/Bobicheng-Zhang/SBRI_2021-2023_analysis
    desc: "Applied consulting project creating composite resilience scores for small businesses in Colorado.
    Integrated survey data across multiple dimensions (cultural well-being, technological adoption, individual
    resilience, human capital, financial and physical health) to inform policy recommendations and resource allocation."

  - title: Displacement-based OKN analysis
    url: https://github.com/Bobicheng-Zhang/OKN-processing-displacement
    desc: "Custom Python pipeline for inferring perceived visual direction from eye movements without explicit user
    reports. Uses horizontal/vertical displacement ratios during optokinetic nystagmus—relevant to passive UX
    measurement, accessibility tools, and AR/VR interfaces where implicit perception tracking is valuable."

  - title: Velocity-based OKN analysis
    url: https://github.com/Bobicheng-Zhang/OKN-processing-velocity
    desc: "Velocity-based gaze processing algorithm for detecting perceptual switches using per-observer thresholds
    and velocity permutations. Demonstrates adaptive signal processing techniques applicable to real-time eye-tracking
    applications in user research and assistive technologies."

  - title: Mechanistic isolation of switch-related pupil response
    desc: "Introducing disparity-simulated perceptual switches to investigate the mechanisms underlying pupil 
    responses accompanying spontaneous perceptual switches"
    highlight: Dissertation!

